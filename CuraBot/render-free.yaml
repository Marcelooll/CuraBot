services:
  - type: web
    name: curabot-free
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT 'webapp:create_app()'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ALLOWED_USER_IDS
        value: ""
