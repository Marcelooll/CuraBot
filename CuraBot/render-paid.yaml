# Configuração paga. Confira a estimativa no painel antes de criar.
services:
  - type: worker
    name: curabot
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: env PYTHONPATH=src python -u src/curabot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CURABOT_STATE_DIR
        value: /var/data/curabot
      - key: ALLOWED_USER_IDS
        value: ""
    disk:
      name: curabot-data
      mountPath: /var/data
      sizeGB: 10
